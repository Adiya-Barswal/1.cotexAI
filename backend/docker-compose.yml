version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: cotexai_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: cotexai_gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped
    depends_on:
      - auth
      - chat
      - ai-agent

  auth:
    build: ./services/auth
    container_name: cotexai_auth
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: unless-stopped

  chat:
    build: ./services/chat
    container_name: cotexai_chat
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    restart: unless-stopped

  ai-agent:
    build: ./services/ai-agent
    container_name: cotexai_ai_agent
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
    restart: unless-stopped

  frontend:
    build: ../frontend
    container_name: cotexai_frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - gateway
